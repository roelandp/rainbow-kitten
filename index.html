<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="theme-color" content="#231a3f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rainbow Kitten" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Engelse woordjes oefenen met Katja" />
    <link rel="apple-touch-icon" href="./misc/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Rainbow Kitten</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Replaced as soon as the app mounts; keeps the first frame from being blank. -->
    <div id="splash">Rainbow Kitten<span>Katja wordt wakker...</span></div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #231a3f;
        color: #fff6e6;
        font: 800 30px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
        z-index: 100;
      }
      #splash span {
        font-size: 15px;
        font-weight: 700;
        color: #ffcf5a;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
        transition: opacity 300ms ease;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
